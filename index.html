<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Paletas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Encabezado de la aplicación -->
    <header class="header">

        <h1>Generador de Paletas</h1>

        <p>
            Genera paletas de colores aleatorias para tus proyectos.
        </p>

    </header>


    <!-- Contenido principal -->
    <main class="main">

        <!-- Configuración de la paleta -->
        <section class="controls">

            <h2>Configura tu paleta</h2>

            <div class="control-group">

                <label for="paletteSize">
                    Cantidad de colores:
                </label>

                <select id="paletteSize" name="paletteSize">

                    <option value="6">6 colores</option>

                    <option value="8">8 colores</option>

                    <option value="9">9 colores</option>

                </select>

            </div>

            <div class="control-group">

    <label for="colorFormat">
        Formato de color:
    </label>

    <select id="colorFormat" name="colorFormat">

        <option value="hex">HEX</option>

        <option value="hsl">HSL</option>

    </select>

</div>


            <!-- Botón principal -->
            <div class="buttons">

    <button
        id="generateBtn"
        class="primary-btn"
        type="button"
    >
        Generar paleta
    </button>

    <button
        id="saveBtn"
        class="secondary-btn"
        type="button"
    >
        Guardar paleta
    </button>

</div>

        </section>


        <!-- Sección donde aparecerá la paleta -->
        <section class="palette-section">

            <h2>Tu paleta</h2>

            <div
                id="palette"
                class="palette"
            >
                <!--
                    Los colores serán agregados
                    posteriormente con JavaScript.
                -->
            </div>

        </section>
        <section class="saved-palette-section">

    <h2>Paleta guardada</h2>

    <div
        id="savedPalette"
        class="palette"
    >
        <!-- La paleta guardada aparecerá aquí -->
    </div>

</section>

    </main>


    <!-- Pie de página -->
    <footer class="footer">

        <p>
            Proyecto final - Módulo 1 · Henry
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
